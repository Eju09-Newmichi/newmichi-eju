<title>EJU Toán · Hóa · Sinh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: a bilingual (JP/VI) e-learning portal. Header + subject menu, a graph-paper profile band, lists/grids of lesson "boards", and a watch page with a text panel. */
:root {
  --paper: #F3F4F8;
  --surface: #FFFFFF;
  --hover: #EEF0F6;
  --ink: #1B1F2A;
  --muted: #5A6072;
  --line: #D9DDE6;
  --line-strong: #B9BFCC;
  --accent: #2D4A9A;
  --accent-soft: #E7ECF8;
  --graphite: #2A2E37;
  --on-graphite: #F4F5F9;
  --ok: #1D7447;
  --ok-soft: #E2F2E8;
  --bad: #B23B27;
  --bad-soft: #FBE8E3;
  --gold: #D69A12;
  --band: #2B4592;
  --band-ink: #FFFFFF;
  --band-grid: rgba(255, 255, 255, 0.09);
  --band-track: rgba(255, 255, 255, 0.24);
  --band-muted: rgba(255, 255, 255, 0.78);
  --shadow: rgba(15, 20, 35, 0.18);

  --c-nihongo: #C8372D;
  --c-sugaku: #1F66C9;
  --c-rika: #178548;
  --c-shakai: #B86B10;
  --c-tango: #B82D72;

  /* lesson boards look the same in both themes, like real video thumbnails */
  --board: #EEF4FB;
  --board-ink: #22314B;
  --board-line: #D6E3F2;
  --sb-nihongo: #C8372D;
  --sb-sugaku: #1F66C9;
  --sb-rika: #178548;
  --sb-shakai: #B86B10;
  --sb-tango: #B82D72;
  --badge: #111827;
  --badge-ink: #FFFFFF;
  --scrim: rgba(17, 24, 39, 0.62);
  --scrim-track: rgba(255, 255, 255, 0.35);

  --subj: var(--accent);
  --subj-board: var(--accent);

  --font-body: "Be Vietnam Pro", "BIZ UDPGothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-jp: "BIZ UDPGothic", "Be Vietnam Pro", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-display: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111318;
    --surface: #191C23;
    --hover: #222631;
    --ink: #E6E8EE;
    --muted: #9BA2B2;
    --line: #2D323D;
    --line-strong: #4A5160;
    --accent: #9DB2F2;
    --accent-soft: #1F2840;
    --graphite: #DDE1E8;
    --on-graphite: #111318;
    --ok: #63C78F;
    --ok-soft: #16301F;
    --bad: #F2836E;
    --bad-soft: #3A1D17;
    --gold: #E8B23A;
    --band: #1C2850;
    --band-ink: #EEF1FA;
    --band-grid: rgba(255, 255, 255, 0.06);
    --band-track: rgba(255, 255, 255, 0.18);
    --band-muted: rgba(238, 241, 250, 0.72);
    --shadow: rgba(0, 0, 0, 0.5);
    --c-nihongo: #F07A6E;
    --c-sugaku: #6FA4F2;
    --c-rika: #5CC48A;
    --c-shakai: #E9A54A;
    --c-tango: #EE7BB5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111318;
  --surface: #191C23;
  --hover: #222631;
  --ink: #E6E8EE;
  --muted: #9BA2B2;
  --line: #2D323D;
  --line-strong: #4A5160;
  --accent: #9DB2F2;
  --accent-soft: #1F2840;
  --graphite: #DDE1E8;
  --on-graphite: #111318;
  --ok: #63C78F;
  --ok-soft: #16301F;
  --bad: #F2836E;
  --bad-soft: #3A1D17;
  --gold: #E8B23A;
  --band: #1C2850;
  --band-ink: #EEF1FA;
  --band-grid: rgba(255, 255, 255, 0.06);
  --band-track: rgba(255, 255, 255, 0.18);
  --band-muted: rgba(238, 241, 250, 0.72);
  --shadow: rgba(0, 0, 0, 0.5);
  --c-nihongo: #F07A6E;
  --c-sugaku: #6FA4F2;
  --c-rika: #5CC48A;
  --c-shakai: #E9A54A;
  --c-tango: #EE7BB5;
  color-scheme: dark;
}
[data-subj="nihongo"] { --subj: var(--c-nihongo); --subj-board: var(--sb-nihongo); }
[data-subj="sugaku"]  { --subj: var(--c-sugaku);  --subj-board: var(--sb-sugaku); }
[data-subj="rika"]    { --subj: var(--c-rika);    --subj-board: var(--sb-rika); }
[data-subj="shakai"]  { --subj: var(--c-shakai);  --subj-board: var(--sb-shakai); }
[data-subj="tango"]   { --subj: var(--c-tango);   --subj-board: var(--sb-tango); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.65; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; }
.in {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.jp { font-family: var(--font-jp); }
.term { font-family: var(--font-jp); font-weight: 700; }
.sec-label { margin: 6px 0 0; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }

/* ---------- Two languages ---------- */
.sep::before { content: " · "; }
.u::before { content: "/"; }
body.lang-vi .sep::before, body.lang-vi .u::before { content: none; }
body.lang-ja .lv { display: none !important; }
body.lang-vi .lj { display: none !important; }
body:not(.lang-vi) .vo { display: none !important; }
:where(.lj + .lv) { color: var(--muted); font-size: 0.92em; }
:where(body.lang-vi) :where(.lj + .lv) { color: inherit; font-size: inherit; }
.bs { display: inline-grid; line-height: 1.25; justify-items: inherit; }
.bs > .lv { font-size: 0.72em; font-weight: 400; }
body.lang-vi .bs > .lv { font-size: 1em; font-weight: inherit; }
.bl { display: grid; gap: 2px; }
li > .lj, li > .lv, td > .lj, td > .lv, h4 > .lv, h2 > .lj, h2 > .lv, .tr { display: block; }
.btn .lj, .btn .lv { color: inherit; }
.tr { font-size: 0.9375rem; line-height: 1.6; color: var(--muted); }
body.lang-vi .tr { color: var(--ink); }
table.org { min-width: 540px; }
.langsw { display: inline-flex; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.langsw button { border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 0.75rem; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.langsw button:hover { color: var(--ink); }
.langsw button[aria-pressed="true"] { background: var(--graphite); color: var(--on-graphite); }

/* ---------- Header ---------- */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.head-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding-block: 12px 2px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.cells { display: inline-flex; gap: 3px; }
.cells b {
  display: inline-grid; place-items: center; width: 1.6rem; height: 1.8rem;
  border: 1.5px solid var(--ink); font-family: var(--font-jp); font-weight: 700; font-size: 0.95rem; line-height: 1;
}
.cells b:last-child { background: var(--graphite); color: var(--on-graphite); border-color: var(--graphite); }
.logo-text { display: grid; line-height: 1.2; }
.logo-text small { font-size: 0.6875rem; color: var(--muted); font-family: var(--font-jp); }
.logo-text b { font-size: 1rem; }
.search { flex: 1 1 300px; max-width: 640px; margin-left: auto; position: relative; }
.search input {
  width: 100%; height: 40px; border-radius: 6px; border: 1px solid transparent; background: var(--hover);
  padding: 0 12px 0 38px; font: inherit; font-size: 0.9375rem; color: var(--ink); font-family: var(--font-jp);
}
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; background: var(--surface); }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
  background: var(--graphite); color: var(--on-graphite); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem;
}
.gnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.gnav::-webkit-scrollbar { display: none; }
.gnav a, .gnav button {
  flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 9px 12px 8px;
  border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer; text-decoration: none;
  font-family: var(--font-jp); font-weight: 700; font-size: 0.9375rem; color: var(--ink); text-align: left;
}
.gnav [data-subj] { color: var(--subj); }
.gnav .is-on { border-bottom-color: currentColor; }
.gnav button[data-subj]::after {
  content: ""; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; opacity: 0.55;
}
.menu {
  position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 14px 34px var(--shadow); max-height: min(62vh, 480px); overflow-y: auto; padding: 4px 0 6px;
}
.menu-head {
  margin: 0 0 4px; padding: 10px 16px 8px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 8px; font-family: var(--font-jp); font-weight: 700; color: var(--subj);
}
.menu-head span { font-family: var(--font-body); font-weight: 400; font-size: 0.8125rem; color: var(--muted); }
.menu-item {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 16px;
  text-decoration: none; color: var(--ink); font-family: var(--font-jp); font-size: 0.9375rem;
}
.menu-item:hover, .menu-item:focus-visible { background: var(--hover); outline: none; }
.tag-plan {
  flex: none; font-family: var(--font-body); font-size: 0.6875rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap;
}

/* ---------- Profile band ---------- */
.band {
  background-color: var(--band); color: var(--band-ink);
  background-image: linear-gradient(var(--band-grid) 1px, transparent 1px), linear-gradient(90deg, var(--band-grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
.band :where(.lj + .lv) { color: var(--band-muted); }
body.lang-vi .band .lv { color: inherit; }
.band-in { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px 32px; align-items: center; padding-block: 26px; }
.me { display: flex; align-items: center; gap: 16px; min-width: 0; }
.avatar-lg {
  width: 72px; height: 72px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--band-ink); color: var(--band); font-family: var(--font-display); font-weight: 700; font-size: 2rem;
}
.me p { margin: 0; }
.me-name { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.me-sub { font-size: 0.8125rem; font-family: var(--font-jp); opacity: 0.92; }
.me-stats p { margin: 0; }
.st-row { display: flex; gap: 22px; font-size: 1.375rem; font-variant-numeric: tabular-nums; }
.st { display: inline-flex; align-items: center; gap: 6px; }
.st .ic { width: 22px; height: 22px; }
.st-time { font-size: 0.8125rem; font-family: var(--font-jp); }
.st-time b { font-family: var(--font-body); font-size: 1.375rem; font-weight: 500; margin: 0 3px 0 6px; font-variant-numeric: tabular-nums; }
.me-level { display: grid; justify-items: end; gap: 6px; text-align: right; }
.me-level p { margin: 0; }
.lv-num { font-size: 0.875rem; }
.lv-num b { font-size: 1.5rem; font-weight: 500; margin-left: 4px; }
.lvbar { width: 100%; max-width: 280px; height: 12px; border-radius: 999px; background: var(--band-track); overflow: hidden; }
.lvbar span { display: block; height: 100%; border-radius: inherit; background: var(--band-ink); }
.lv-next { font-size: 0.8125rem; font-family: var(--font-jp); }

/* ---------- Home tabs & lists ---------- */
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.htab {
  flex: none; border: 0; border-bottom: 3px solid transparent; background: none; cursor: pointer;
  padding: 12px 16px 9px; font-family: var(--font-jp); font-size: 0.9375rem; color: var(--muted); text-align: left;
}
.htab:hover { color: var(--ink); }
.htab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.home-list { max-width: 660px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 12px; }

.vrow {
  display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  text-decoration: none; color: var(--ink);
}
.vrow:hover { border-color: var(--subj); }
.vrow-body { min-width: 0; display: grid; gap: 1px; }
.vrow-body p, .vcard p { margin: 0; }
.clabel { font-size: 0.8125rem; color: var(--subj); font-family: var(--font-jp); line-height: 1.45; }
.vtitle { font-family: var(--font-jp); font-size: 1rem; line-height: 1.5; overflow-wrap: anywhere; }
.vvi { font-size: 0.8125rem; color: var(--muted); line-height: 1.45; }
.vmeta { margin-top: 6px !important; font-size: 0.8125rem; color: var(--muted); font-family: var(--font-jp); font-variant-numeric: tabular-nums; }

.crow {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  text-decoration: none; color: var(--ink);
}
.crow:hover { border-color: var(--subj); }
.crow p { margin: 0; }
.crow-series { font-size: 0.8125rem; color: var(--subj); font-family: var(--font-jp); }
.crow-name { font-size: 1.125rem; font-family: var(--font-jp); line-height: 1.4; }
.crow-side { display: grid; justify-items: end; gap: 5px; flex: none; }
.crow-prog { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--font-jp); }
.minibar { width: 96px; height: 6px; border-radius: 999px; background: var(--hover); overflow: hidden; }
.minibar span { display: block; height: 100%; background: var(--subj); }
.sblock { display: grid; gap: 8px; }
.sb-head { margin: 10px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sb-name { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; color: var(--subj); }
.sb-name small { font-family: var(--font-body); font-weight: 400; font-size: 0.8125rem; color: var(--muted); margin-left: 8px; }
.sb-count { font-size: 0.8125rem; color: var(--muted); font-family: var(--font-jp); }
.empty {
  background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius);
  padding: 18px 20px; display: grid; gap: 6px;
}
.empty p { margin: 0; }
.empty-t { font-weight: 700; }

/* ---------- Thumbnails (lesson boards) ---------- */
.thumb {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden;
  container-type: inline-size; background: var(--board); border: 1px solid var(--board-line);
}
.board {
  position: absolute; inset: 0; padding: 5cqw 6cqw; display: grid; grid-template-rows: auto 1fr;
  color: var(--board-ink); background-image: linear-gradient(var(--board-line) 1px, transparent 1px); background-size: 100% 12cqw;
}
.b-tag { font-family: var(--font-jp); font-size: 4.6cqw; color: var(--subj-board); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-lines { display: grid; align-content: center; justify-items: start; gap: 1.5cqw; }
.b-line { font-family: var(--font-jp); font-weight: 700; font-size: 8cqw; line-height: 1.2; white-space: nowrap; }
.b-line.small { font-size: 6.2cqw; white-space: normal; }
.b-mark { position: absolute; left: 6cqw; bottom: 4cqw; font-family: var(--font-display); font-weight: 700; font-size: 5cqw; color: var(--subj-board); }
.dur {
  position: absolute; right: 4cqw; bottom: 4cqw; background: var(--badge); color: var(--badge-ink);
  font-size: max(10px, 5.5cqw); line-height: 1.25; padding: 0.15em 0.45em; border-radius: 2px; font-variant-numeric: tabular-nums;
}
.donebadge {
  position: absolute; left: 3cqw; top: 3cqw; width: max(18px, 10cqw); height: max(18px, 10cqw);
  border-radius: 50%; background: var(--gold); color: var(--badge-ink); display: grid; place-items: center;
}
.donebadge svg { width: 62%; height: 62%; }
.thumb.plan { opacity: 0.6; }

/* ---------- Pages ---------- */
.page { padding-block: 20px 48px; display: grid; gap: 18px; }
.crumb { margin: 0; font-size: 0.8125rem; color: var(--muted); font-family: var(--font-jp); overflow-wrap: anywhere; }
.crumb a { color: var(--accent); text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.page-t { margin: 0; font-family: var(--font-jp); font-size: 1.5rem; }

/* Course page */
.chead {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px;
  display: grid; grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1.3fr); gap: 18px 32px; align-items: center;
}
.chead p { margin: 0; }
.chead-series { font-size: 0.875rem; font-family: var(--font-jp); color: var(--muted); }
.chead-name { margin: 2px 0 0; font-family: var(--font-jp); font-size: 2rem; line-height: 1.2; color: var(--subj); }
.chead-vi { font-size: 0.9375rem; color: var(--muted); margin-bottom: 6px !important; }
.troph-line { display: flex; align-items: center; gap: 6px; font-size: 1.25rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px !important; }
.troph-line b { color: var(--ink); font-weight: 500; }
.ring { width: 128px; height: 128px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-txt { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-txt b { font-size: 1.75rem; font-weight: 500; color: var(--subj); font-variant-numeric: tabular-nums; }
.ring-txt span { font-size: 0.8125rem; color: var(--muted); }
.chead-next { display: grid; gap: 6px; min-width: 0; }
.next-link { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; text-decoration: none; color: var(--ink); }
.next-link:hover .vtitle { color: var(--subj); }
.cbody { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
.caside { display: grid; gap: 12px; min-width: 0; }
.sel {
  display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 8px 14px; font-family: var(--font-jp); font-size: 0.875rem;
}
.sel select { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent; border: 0; padding: 4px 0; }
.chlist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 0; display: grid; }
.chbtn {
  display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 9px 16px; font-family: var(--font-jp); font-size: 0.9375rem; color: var(--ink);
}
.chbtn:hover { background: var(--hover); }
.chbtn[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
.chbtn .ic { color: var(--line-strong); }
.chbtn .ic.gold { color: var(--gold); }
.cmain { display: grid; gap: 26px; min-width: 0; }
.chsec { display: grid; gap: 12px; }
.chsec h2 { margin: 0; font-family: var(--font-jp); font-size: 1.25rem; line-height: 1.35; }
.chsec h2 .lv { font-family: var(--font-body); font-weight: 500; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.vcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  display: grid; gap: 8px; align-content: start; text-decoration: none; color: var(--ink); min-width: 0;
}
.vcard > div:last-child { display: grid; gap: 1px; }

  function trHTML(tr) { return tr ? '<p class="tr lv">' + tr + "</p>" : ""; }
  function qHTML(pid, q, i) {
    var no = "問" + (i + 1);
    var head = '<p class="q-stem"><span class="q-no">' + no + "</span>" + q.q + "</p>" + trHTML(q.tr);
    var tail = '<p class="q-result" aria-live="polite"></p><div class="kaisetsu" hidden><p class="k-label">' + bi("解説", "Lời giải") + "</p>" + para(q.ex) + "</div>";
    if (q.k === "fill") {
      return '<div class="q" data-kind="fill">' + head + '<div class="cells-row">' +
        q.cells.map(function (cl) { return '<label class="cell"><span>' + cl[0] + '</span><input id="' + pid + "-" + i + "-" + cl[0] + '" type="text" inputmode="numeric" autocomplete="off" maxlength="1" data-answer="' + cl[1] + '" aria-label="Ô ' + cl[0] + '"></label>'; }).join("") +
        "</div>" + tail + "</div>";
    }
    return '<div class="q" data-kind="mc" data-answer="' + q.a + '">' + head + '<div class="opts" role="radiogroup" aria-label="' + no + '">' +
      q.o.map(function (o, j) { return '<label class="opt"><input type="radio" name="' + pid + "-" + i + '" id="' + pid + "-" + i + "-" + (j + 1) + '" value="' + (j + 1) + '"><span class="oval">' + (j + 1) + '</span><span class="opt-text">' + o + "</span></label>"; }).join("") +
      "</div>" + tail + "</div>";

  function doneNote() { return bi("この授業は完了しています。", "Bài này đã hoàn thành."); }
  function quizHTML(pid, qs) {

      '<div class="score-bar"><button type="button" class="btn btn-primary" data-grade>' + bi("答え合わせ", "Chấm điểm") + '</button><button type="button" class="btn btn-ghost" data-reset>' + bi("やり直す", "Làm lại") + '</button><p class="score-out" aria-live="polite">' +
      (st.done[vState.id] ? doneNote() : bi("未採点", "Chưa chấm")) + "</p></div>";

  function vocabTable(words) {
    return '<div class="table-scroll"><table class="vocab"><thead><tr><th>' + bi("用語", "Thuật ngữ") + "</th><th>" + bi("意味", "Nghĩa") + "</th></tr></thead><tbody>" +
      words.map(function (w) { return "<tr><td>" + ruby(w) + '</td><td class="mean"><span>' + w[2] + "</span></td></tr>"; }).join("") + "</tbody></table></div>";
  }
  function vocabQs(words) {
    var n = words.length, k = Math.min(5, n), qs = [];
    for (var i = 0; i < k; i++) {
      var idx = Math.floor(i * n / k), w = words[idx], opts = [w[2]];
      for (var d = 1; opts.length < 4 && d < n * 2; d++) {
        var cand = words[(idx + d * 2) % n][2];
        if (opts.indexOf(cand) === -1) opts.push(cand);
      }
      var rot = i % opts.length, o = opts.slice(rot).concat(opts.slice(0, rot));
      qs.push({ k: "mc", q: "「" + ruby(w) + "」の意味はどれか。", tr: "Từ này nghĩa là gì?", o: o, a: o.indexOf(w[2]) + 1, ex: ruby(w) + ": " + w[2] + "." });
    }
    return qs;
  }
  function ptitle(ja, vi) { return '<h2 class="ptitle">' + (vi ? bs(ja, vi) : ja) + "</h2>"; }

    var v = V[vState.id], c = CMAP[v.c], tab = vState.tab, html = "";

        : ["各問で1つ選んで、「答え合わせ」を押そう。", "Chọn một đáp án cho mỗi câu, rồi bấm Chấm điểm."];
      html = '<section class="psec" id="p-point">' + ptitle("Point") + blocks(v.point) + "</section>" +
        '<section class="psec" id="p-rei">' + ptitle("例題", "Ví dụ") + '<div class="prob"><p class="q-stem">' + v.rei.q + "</p>" + trHTML(v.rei.tr) + '</div><div class="muted small">' + para(["解答は「解答」タブで確認しよう。", "Lời giải xem ở tab Lời giải (解答)."]) + "</div></section>" +
        '<section class="psec quiz" id="p-prac">' + ptitle("練習", "Luyện tập") + '<div class="muted small">' + para(hint) + "</div>" + quizHTML(pid, v.pr) + "</section>";
    } else if (tab === "ans") {
      html = '<section class="psec">' + ptitle("例題の解答", "Lời giải ví dụ") + '<div class="prob"><p class="q-stem">' + v.rei.q + "</p>" + trHTML(v.rei.tr) + "</div>" + para(v.rei.a) + "</section>" +
        '<section class="psec">' + ptitle("練習の解答", "Lời giải luyện tập") + v.pr.map(function (q, i) {
          var key = q.k === "fill" ? q.cells.map(function (cl) { return cl[0] + " = " + cl[1]; }).join(", ") : CIRCLED[q.a] + " " + q.o[q.a - 1];
          return '<div class="ansitem"><p class="q-stem"><span class="q-no">問' + (i + 1) + "</span>" + q.q + '</p><p class="ans-key">' + bi("答え", "Đáp án") + ": " + key + "</p>" + para(q.ex) + "</div>";
        }).join("") + "</section>";
    } else if (tab === "sum") {
      html = '<section class="psec">' + ptitle("要点まとめ", "Tóm tắt") + "<ul>" + v.sum.map(li).join("") + "</ul></section>" +
        '<section class="psec">' + ptitle("用語", "Thuật ngữ") + vocabTable(v.terms) + "</section>";
    } else if (tab === "list") {
      html = '<section class="psec">' + ptitle("単語リスト", "Danh sách từ") + '<div class="vocab-bar">' + para(["「意味をかくす」で自分をテスト。灰色の部分をタップすると表示されます。", "Bấm Ẩn nghĩa để tự kiểm tra, chạm vào ô xám để xem lại."]) +
        '<button type="button" class="btn btn-ghost btn-small" id="hideVi" aria-pressed="false">' + bi("意味をかくす", "Ẩn nghĩa") + "</button></div>" + vocabTable(v.words) + "</section>";
    } else if (tab === "test") {
      html = '<section class="psec quiz" id="p-test">' + ptitle("テスト", "Kiểm tra") + '<div class="muted small">' + para(["正しい意味を選ぼう。全問正解でこの単語セットは完了です。", "Chọn nghĩa đúng của mỗi từ. Đúng hết là hoàn thành bộ từ này."]) + "</div>" + quizHTML(pid, vocabQs(v.words)) + "</section>";
    } else {
      html = '<section class="psec">' + ptitle(c.label, c.labelVi) + c.ch.filter(function (ch) { return ch.v; }).map(function (ch) {

          return '<li><a href="#v-' + x + '"' + (x === v.id ? ' aria-current="true"' : "") + '><span class="near-t"><span>' + V[x].t + '</span><span class="lv">' + V[x].vi + '</span></span><span class="near-d">' + V[x].dur + "</span>" + (st.done[x] ? '<span class="near-ok">' + bi("完了", "Xong") + "</span>" : "") + "</a></li>";
        }).join("") + "</ol>";

        var on = !table.classList.contains("hide-vi");
        table.classList.toggle("hide-vi", on);
        table.querySelectorAll("tr.peek").forEach(function (tr) { tr.classList.remove("peek"); });
        hv.setAttribute("aria-pressed", on ? "true" : "false");
        hv.innerHTML = on ? bi("意味を表示", "Hiện nghĩa") : bi("意味をかくす", "Ẩn nghĩa");
      });
      table.addEventListener("click", function (e) {
        var cell = e.target.closest("td.mean");
        if (cell && table.classList.contains("hide-vi")) cell.parentElement.classList.toggle("peek");
      });
    }
  }

  function bindQuiz(quiz) {
    var cells = Array.prototype.slice.call(quiz.querySelectorAll(".cell input"));
    cells.forEach(function (input, i) {
      input.addEventListener("input", function () {
        var val = input.value.replace(/[０-９]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
          .replace(/[ー－‐—–]/g, "-").replace(/[^0-9-]/g, "");
        input.value = val.slice(-1);
        input.classList.remove("is-ok", "is-bad");
        if (input.value && cells[i + 1]) cells[i + 1].focus();
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Backspace" && !input.value && cells[i - 1]) cells[i - 1].focus();
      });
    });
    function clearMarks() {
      quiz.querySelectorAll(".q").forEach(function (q) {
        q.classList.remove("is-ok", "is-bad", "is-blank");
        q.querySelector(".q-result").innerHTML = "";
        q.querySelector(".kaisetsu").hidden = true;
        q.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("is-key", "is-wrong"); });
        q.querySelectorAll(".cell input").forEach(function (x) { x.classList.remove("is-ok", "is-bad"); });
      });
    }
    quiz.querySelector("[data-grade]").addEventListener("click", function () {
      clearMarks();
      var qs = quiz.querySelectorAll(".q"), score = 0;
      qs.forEach(function (q) {
        var correct = false, blank = false;
        if (q.dataset.kind === "fill") {
          correct = true;
          q.querySelectorAll(".cell input").forEach(function (x) {
            var ok = x.value === x.dataset.answer;
            if (!x.value) blank = true;
            if (!ok) correct = false;
            x.classList.add(ok ? "is-ok" : "is-bad");
          });
        } else {
          var picked = q.querySelector("input:checked");
          var key = q.querySelector('input[value="' + q.dataset.answer + '"]');
          blank = !picked;
          correct = !!picked && picked.value === q.dataset.answer;
          if (key) key.closest(".opt").classList.add("is-key");
          if (picked && !correct) picked.closest(".opt").classList.add("is-wrong");
        }
        if (correct) score++;
        q.classList.add(correct ? "is-ok" : (blank ? "is-blank" : "is-bad"));
        var circ = CIRCLED[+q.dataset.answer];
        var ans = q.dataset.kind === "mc" && !correct ? " · " + bi("正解は" + circ, "Đáp án " + circ) : "";
        q.querySelector(".q-result").innerHTML = (correct ? bi("正解", "Đúng") : (blank ? bi("未解答", "Bỏ trống") : bi("不正解", "Chưa đúng"))) + ans;
        q.querySelector(".kaisetsu").hidden = false;
      });
      var total = qs.length, perfect = score === total;
      if (perfect && !st.done[vState.id]) { st.done[vState.id] = true; save(); updateStatus(); }
      quiz.querySelector(".score-out").innerHTML = bi("得点", "Điểm") + " <strong>" + score + " / " + total + "</strong>" + (perfect ? " · " + bi("この授業を完了しました！", "Hoàn thành bài này!") : "");
    });
    quiz.querySelector("[data-reset]").addEventListener("click", function () {
      clearMarks();
      quiz.querySelectorAll(".cell input").forEach(function (x) { x.value = ""; });
      quiz.querySelectorAll('input[type="radio"]').forEach(function (r) { r.checked = false; });
      quiz.querySelector(".score-out").innerHTML = st.done[vState.id] ? doneNote() : bi("未採点", "Chưa chấm");
    });
  }

  function openMenu(btn) {
    clearTimeout(hideTimer);

    menuFor = s;
    menu.setAttribute("data-subj", s);

      }).join("");
    menu.hidden = false;

    placeMenu(btn);

      menu.style.left = "12px"; menu.style.right = "12px"; menu.style.width = "auto";
    } else {
      var w = 360, left = Math.min(br.left - hr.left, hr.width - w - 12);
      menu.style.left = Math.max(12, left) + "px"; menu.style.right = "auto"; menu.style.width = w + "px";
    }
  }
  function closeMenu() {
    menu.hidden = true; menuFor = null;

  gnav.querySelectorAll("button[data-subj]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (menuFor === btn.dataset.subj && !menu.hidden) closeMenu(); else openMenu(btn);
    });
    if (canHover) btn.addEventListener("mouseenter", function () { openMenu(btn); });
  });
  gnav.addEventListener("scroll", function () {
    var open = gnav.querySelector('button[aria-expanded="true"]');
    if (open && !menu.hidden) placeMenu(open);
  }, { passive: true });
  if (canHover) {
    head.addEventListener("mouseleave", function () { hideTimer = setTimeout(closeMenu, 180); });
    head.addEventListener("mouseenter", function () { clearTimeout(hideTimer); });
  }
  document.addEventListener("click", function (e) {
    if (!menu.hidden && !menu.contains(e.target) && !e.target.closest("#gnav button[data-subj]")) closeMenu();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
  menu.addEventListener("click", function (e) { if (e.target.closest("a")) closeMenu(); });
  window.addEventListener("resize", closeMenu);

  /* ================= ROUTER ================= */
  var searchBox = document.getElementById("q");
  function markNav(key) {
    gnav.querySelectorAll("[data-nav]").forEach(function (a) { a.classList.toggle("is-on", a.dataset.nav === key); });
  }
  function route() {
    closeMenu();
    var h = (location.hash || "").slice(1);
    if (searchBox.value && h) searchBox.value = "";
    if (h.indexOf("c-") === 0 && CMAP[h.slice(2)]) { renderCourse(h.slice(2)); markNav(CMAP[h.slice(2)].s); }
    else if (h.indexOf("v-") === 0 && V[h.slice(2)]) { renderVideo(h.slice(2)); markNav(CMAP[V[h.slice(2)].c].s); }
    else if (h === "bookmark") { renderBookmarks(); markNav("bookmark"); }
    else if (h === "ranking") { renderRanking(); markNav("ranking"); }
    else { renderHome(); markNav("home"); }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  document.getElementById("avatar").addEventListener("click", function () {
    homeTab = "hist";
    if (location.hash === "#home") route(); else location.hash = "home";
  });
  var sTimer;
  searchBox.addEventListener("input", function () {
    clearTimeout(sTimer);
    sTimer = setTimeout(function () {
      var q = searchBox.value.trim();
      if (q) { renderSearch(q); markNav(""); } else route();
    }, 180);
  });
  route();
})();
</script>
