<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-labelledby="t d">
  <title id="t">仰角と木の高さ</title>
  <desc id="d">Đứng cách cây 10 m, nhìn ngọn cây với góc nâng 30 độ, cây cao 10 tan 30 độ mét.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <line class="l" x1="20" y1="170" x2="420" y2="170"/><line class="rl" x1="50" y1="170" x2="310" y2="20"/><line class="ul" x1="310" y1="170" x2="310" y2="20"/><path class="t" d="M298 170 V158 H310"/><path class="rl" d="M100 170 A50 50 0 0 0 93 145"/>
  <circle class="p" cx="50" cy="170" r="4"/><text class="r" x="106" y="164">30° 仰角</text><text class="s" x="170" y="164">góc nâng</text>
  <text x="180" y="190" text-anchor="middle">10 m</text><text class="u" x="318" y="90">h = 10 tan 30°</text><text class="u" x="318" y="112">= 10√3/3 m</text>
  <circle cx="310" cy="22" r="13" fill="#E2F2E8" stroke="#1D7447"/>
</svg>
