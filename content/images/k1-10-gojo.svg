<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-labelledby="t d">
  <title id="t">ユークリッドの互除法</title>
  <desc id="d">391 và 299: chia liên tiếp, số dư 92, 23, 0; số chia cuối cùng 23 là ước chung lớn nhất.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
