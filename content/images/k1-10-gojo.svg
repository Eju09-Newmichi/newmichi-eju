  </style>
  <text x="20" y="34">391 = 299 × 1 + <tspan class="u">92</tspan></text><text x="20" y="64">299 = <tspan class="u">92</tspan> × 3 + <tspan class="r">23</tspan></text><text x="20" y="94">92 = <tspan class="r">23</tspan> × 4 + 0</text>
