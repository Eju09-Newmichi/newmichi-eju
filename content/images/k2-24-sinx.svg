<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-labelledby="t d">
  <title id="t">sin x &lt; x &lt; tan x</title>
  <desc id="d">Trên đường tròn đơn vị với góc x: đoạn sin x (đỏ) &lt; cung x (xanh) &lt; đoạn tan x (cam); suy ra sin x / x tiến tới 1.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <path class="ax" d="M50 190 H240 M60 200 V5"/>
  <path class="t" d="M210 190 A150 150 0 0 0 60 40"/>
  <path class="l" d="M60 190 L210 11.2"/>
  <path class="rl" d="M156.4 75.1 V190"/>
  <path class="ul" d="M210 190 A150 150 0 0 0 156.4 75.1"/>
  <path class="ol" d="M210 190 V11.2"/>
  <text x="46" y="206">O</text><text x="212" y="206">A</text><text x="214" y="16">T</text><text x="140" y="70">P</text>
  <text class="s" x="80" y="180">x</text>
  <text class="r" x="160" y="150">sin x</text><text class="u" x="186" y="120">x</text><text x="218" y="100" style="fill:#B9531A;font-weight:700">tan x</text>
  <text class="s" x="270" y="80">sin x &lt; x &lt; tan x</text>
  <text class="s" x="270" y="110">→ cos x &lt; sin x / x &lt; 1</text>
  <text class="r" x="270" y="150">sin x / x → 1</text>
</svg>
