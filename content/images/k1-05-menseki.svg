<svg xmlns="http://www.w3.org/2000/svg" width="460" height="190" viewBox="0 0 460 190" role="img" aria-labelledby="t d">
  <title id="t">三角形の面積</title>
  <desc id="d">Tam giác ABC với cạnh AB bằng c, AC bằng b, chiều cao h bằng b sin A, diện tích bằng một phần hai b c sin A.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <path class="fr" d="M40 160 L290 160 L150 40 Z"/><path class="l" d="M40 160 L290 160 L150 40 Z"/><line class="ul" x1="150" y1="40" x2="150" y2="160"/><path class="t" d="M140 160 V150 H150"/><path class="rl" d="M72 160 A32 32 0 0 0 64 138"/>
  <text x="26" y="178">A</text><text x="292" y="178">B</text><text x="146" y="34">C</text><text class="r" x="78" y="154">A</text><text x="84" y="92">b</text><text x="160" y="180" text-anchor="middle">c</text><text class="u" x="156" y="108">h</text>
  <text class="u" x="310" y="70">h = b sin A</text><text x="310" y="104">S = ½ c h</text><text class="r" x="310" y="134">= ½ bc sin A</text>
</svg>
