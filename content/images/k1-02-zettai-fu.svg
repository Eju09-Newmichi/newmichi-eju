<svg xmlns="http://www.w3.org/2000/svg" width="460" height="190" viewBox="0 0 460 190" role="img" aria-labelledby="t d">
  <title id="t">絶対値を含む不等式</title>
  <desc id="d">|x| &lt; a: x nằm giữa −a và a. |x| > a: x nằm ngoài, nhỏ hơn −a hoặc lớn hơn a. Không lấy hai đầu −a và a.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 16px; }
    .h { font-size: 17px; font-weight: 700; }
  </style>
  <text class="h" x="20" y="26">|x| &lt; a　⟺　−a &lt; x &lt; a</text>
  <line x1="30" y1="62" x2="430" y2="62" stroke="#1B1F2A" stroke-width="1.5"/>
  <line x1="150" y1="62" x2="310" y2="62" stroke="#C62828" stroke-width="4"/>
  <circle cx="150" cy="62" r="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
  <circle cx="310" cy="62" r="6" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/>
  <line x1="230" y1="56" x2="230" y2="68" stroke="#1B1F2A"/>
  <text x="150" y="86" text-anchor="middle">−a</text><text x="230" y="86" text-anchor="middle">0</text><text x="310" y="86" text-anchor="middle">a</text>

  <text class="h" x="20" y="118">|x| &gt; a　⟺　x &lt; −a,　a &lt; x</text>
  <line x1="30" y1="154" x2="430" y2="154" stroke="#1B1F2A" stroke-width="1.5"/>
  <line x1="36" y1="154" x2="144" y2="154" stroke="#1F66C9" stroke-width="4"/>
  <line x1="316" y1="154" x2="424" y2="154" stroke="#1F66C9" stroke-width="4"/>
  <path d="M44 147 L32 154 L44 161" fill="none" stroke="#1F66C9" stroke-width="2"/>
  <path d="M416 147 L428 154 L416 161" fill="none" stroke="#1F66C9" stroke-width="2"/>
  <circle cx="150" cy="154" r="6" fill="#FFFFFF" stroke="#1F66C9" stroke-width="2"/>
  <circle cx="310" cy="154" r="6" fill="#FFFFFF" stroke="#1F66C9" stroke-width="2"/>
  <line x1="230" y1="148" x2="230" y2="160" stroke="#1B1F2A"/>
  <text x="150" y="180" text-anchor="middle">−a</text><text x="230" y="180" text-anchor="middle">0</text><text x="310" y="180" text-anchor="middle">a</text>
</svg>
