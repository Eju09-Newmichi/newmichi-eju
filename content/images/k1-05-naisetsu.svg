<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-labelledby="t d">
  <title id="t">内接円と角の二等分線</title>
  <desc id="d">Bên trái: đường tròn nội tiếp bán kính r, S bằng một phần hai r nhân a cộng b cộng c. Bên phải: đường phân giác AD chia tam giác thành hai phần.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <path class="fu" d="M110 25 L20 170 L220 170 Z"/><path class="l" d="M110 25 L20 170 L220 170 Z"/><circle class="rl" cx="114" cy="117.5" r="52.5"/><line class="rl" x1="114" y1="117.5" x2="114" y2="170"/><text class="r" x="120" y="150">r</text><circle class="p" cx="114" cy="117.5" r="3"/>
  <text x="104" y="20">A</text><text x="6" y="186">B</text><text x="224" y="186">C</text><text class="s" x="120" y="192" text-anchor="middle">S = ½ r(a + b + c)</text>
  <path class="fr" d="M325 30 L265 170 L346 170 Z"/><path class="fu" d="M325 30 L346 170 L445 170 Z"/><path class="l" d="M325 30 L265 170 L445 170 Z"/><line class="rl" x1="325" y1="30" x2="346" y2="170"/>
  <text x="320" y="24">A</text><text x="252" y="186">B</text><text x="448" y="186" text-anchor="end">C</text><text class="r" x="342" y="186">D</text>
</svg>
