<svg xmlns="http://www.w3.org/2000/svg" width="460" height="180" viewBox="0 0 460 180" role="img" aria-labelledby="t d">
  <title id="t">共通部分と和集合</title>
  <desc id="d">Bên trái: giao A ∩ B là phần chung của hai hình tròn. Bên phải: hợp A ∪ B là toàn bộ hai hình tròn.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 16px; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: #5A6072; }
  </style>
  <defs>
    <clipPath id="cB1"><circle cx="126" cy="100" r="44"/></clipPath>
  </defs>
  <text class="h" x="105" y="22" text-anchor="middle">A ∩ B（共通部分）</text>
  <rect x="12" y="34" width="190" height="132" fill="#FFFFFF" stroke="#1B1F2A" stroke-width="1.2"/>
  <text class="s" x="20" y="52">U</text>
  <circle cx="84" cy="100" r="44" fill="#C62828" fill-opacity="0.35" clip-path="url(#cB1)"/>
  <circle cx="84" cy="100" r="44" fill="none" stroke="#1F66C9" stroke-width="2"/>
  <circle cx="126" cy="100" r="44" fill="none" stroke="#B9531A" stroke-width="2"/>
  <text x="60" y="104">A</text><text x="144" y="104">B</text>
  <text class="s" x="107" y="160" text-anchor="middle">A かつ B · thuộc cả A và B</text>

  <text class="h" x="355" y="22" text-anchor="middle">A ∪ B（和集合）</text>
  <rect x="258" y="34" width="190" height="132" fill="#FFFFFF" stroke="#1B1F2A" stroke-width="1.2"/>
  <text class="s" x="266" y="52">U</text>
  <circle cx="332" cy="100" r="44" fill="#C62828" fill-opacity="0.35"/>
  <circle cx="374" cy="100" r="44" fill="#C62828" fill-opacity="0.35"/>
  <circle cx="332" cy="100" r="44" fill="none" stroke="#1F66C9" stroke-width="2"/>
  <circle cx="374" cy="100" r="44" fill="none" stroke="#B9531A" stroke-width="2"/>
  <text x="308" y="104">A</text><text x="392" y="104">B</text>
  <text class="s" x="353" y="160" text-anchor="middle">A または B · thuộc ít nhất một tập</text>
</svg>
