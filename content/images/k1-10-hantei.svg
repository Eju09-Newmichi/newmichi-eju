<svg xmlns="http://www.w3.org/2000/svg" width="460" height="170" viewBox="0 0 460 170" role="img" aria-labelledby="t d">
  <title id="t">倍数の判定法</title>
  <desc id="d">Bảng dấu hiệu chia hết cho 2, 5, 4, 3, 9 áp dụng cho số 2016.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <text class="b" x="20" y="28">2016</text><text class="s" x="80" y="28">で調べる · xét số 2016</text>
  <g class="t"><path d="M15 40 H445 M15 66 H445 M15 92 H445 M15 118 H445 M15 150 H445"/></g>
  <text class="u" x="20" y="60">2, 5</text><text x="70" y="60">一の位 · hàng đơn vị</text><text class="r" x="300" y="60">6 → 2 の倍数</text>
  <text class="u" x="20" y="86">4</text><text x="70" y="86">下 2 桁 · hai chữ số cuối</text><text class="r" x="300" y="86">16 → 4 の倍数</text>
  <text class="u" x="20" y="112">3, 9</text><text x="70" y="112">各位の和 · tổng các chữ số</text><text class="r" x="300" y="112">9 → 3, 9 の倍数</text>
  <text class="s" x="20" y="140">2 + 0 + 1 + 6 = 9　→　5 の倍数ではない · không chia hết cho 5</text>
</svg>
