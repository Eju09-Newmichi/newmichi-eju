<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-labelledby="t d">
  <title id="t">楕円</title>
  <desc id="d">Elip x²/25 + y²/9 = 1 có tiêu điểm F(4, 0), F'(−4, 0); với mọi điểm P trên elip, PF + PF' = 10.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
