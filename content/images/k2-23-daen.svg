  <text x="262" y="128">F</text><text x="60" y="128">F'</text><text class="r" x="238" y="40">P</text>
  <text class="s" x="282" y="106">5</text><text class="s" x="174" y="32">3</text>
  <text class="r" x="330" y="70">PF + PF' = 10</text><text class="s" x="330" y="100">長軸 10 · trục lớn</text><text class="s" x="330" y="118">短軸 6 · trục nhỏ</text>
