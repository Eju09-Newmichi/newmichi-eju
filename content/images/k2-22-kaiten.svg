<svg xmlns="http://www.w3.org/2000/svg" width="420" height="230" viewBox="0 0 420 230" role="img" aria-labelledby="t d">
  <title id="t">点のまわりの回転</title>
  <desc id="d">Quay điểm 4 + i quanh điểm 1 + i một góc π/2 được điểm 1 + 4i.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <path class="ax" d="M20 200 H260 M40 220 V20"/>
  <path class="l" d="M75 165 L180 165"/><path class="rl" d="M75 165 L75 60"/>
  <path class="d" d="M180 165 A105 105 0 0 0 75 60"/>
  <path class="t" d="M95 165 V145 H75"/>
  <circle class="k" cx="75" cy="165" r="4"/><circle class="k" cx="180" cy="165" r="4"/><circle class="p" cx="75" cy="60" r="5"/>
  <text x="58" y="184">α = 1 + i</text><text x="168" y="186">β = 4 + i</text><text class="r" x="84" y="56">1 + 4i</text>
  <text class="s" x="150" y="90">π/2</text>
  <text class="s" x="230" y="60">(β − α)·i + α</text><text class="s" x="230" y="90">= 3i + 1 + i</text><text class="r" x="230" y="120">= 1 + 4i</text>
</svg>
