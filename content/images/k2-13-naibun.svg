<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-labelledby="t d">
  <title id="t">内分点と外分点</title>
  <desc id="d">A và B trên một đường thẳng; P chia trong AB theo tỉ số 3 : 2, Q chia ngoài AB theo tỉ số 3 : 2.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <path class="l" d="M30 70 H400"/>
  <circle class="k" cx="40" cy="70" r="4"/><circle class="k" cx="140" cy="70" r="4"/><circle class="p" cx="100" cy="70" r="5"/><circle class="p" cx="340" cy="70" r="5"/>
  <g text-anchor="middle"><text x="40" y="58">A</text><text x="140" y="58">B</text><text class="r" x="100" y="58">P</text><text class="r" x="340" y="58">Q</text>
  <text class="u" x="70" y="98">3</text><text class="u" x="120" y="98">2</text><text class="u" x="190" y="128">AQ : QB = 3 : 2</text></g>
  <path class="ul" d="M40 82 Q70 92 100 82 M100 82 Q120 92 140 82"/>
  <text class="s" x="20" y="25">内分 P：(nx₁+mx₂)/(m+n)　·　Chia trong</text>
  <text class="s" x="230" y="100">外分 Q：n → −n</text><text class="s" x="230" y="116">Chia ngoài</text>
</svg>
