<svg xmlns="http://www.w3.org/2000/svg" width="460" height="190" viewBox="0 0 460 190" role="img" aria-labelledby="t d">
  <title id="t">方べきの定理</title>
  <desc id="d">Điểm P nằm ngoài đường tròn, hai cát tuyến PAB và PCD, tiếp tuyến PT.</desc>
  <style>
