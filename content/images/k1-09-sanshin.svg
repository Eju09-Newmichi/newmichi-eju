<svg xmlns="http://www.w3.org/2000/svg" width="460" height="215" viewBox="0 0 460 215" role="img" aria-labelledby="t d">
  <title id="t">外心・内心・重心</title>
  <desc id="d">Ba tam giác: tâm ngoại tiếp O với đường tròn đi qua ba đỉnh, tâm nội tiếp I với đường tròn tiếp xúc ba cạnh, trọng tâm G là giao điểm ba trung tuyến.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <path class="l" d="M75 25 L15 135 L135 135 Z"/><circle class="ul" cx="75" cy="96.4" r="71.4"/><circle class="p" cx="75" cy="96.4" r="3.5"/><text class="r" x="82" y="100">O</text>
  <path class="l" d="M230 25 L170 135 L290 135 Z"/><circle class="ul" cx="230" cy="99.3" r="35.7"/><circle class="p" cx="230" cy="99.3" r="3.5"/><text class="r" x="237" y="103">I</text>
  <path class="l" d="M385 25 L325 135 L445 135 Z"/><g class="ol"><path d="M385 25 L385 135"/><path d="M325 135 L415 80"/><path d="M445 135 L355 80"/></g><circle class="p" cx="385" cy="98.3" r="3.5"/><text class="r" x="392" y="104">G</text>
  <g text-anchor="middle"><text class="b" x="75" y="188" style="font-size:13px">外心 · tâm ngoại tiếp</text><text class="s" x="75" y="206">垂直二等分線 · trung trực</text><text class="b" x="230" y="188" style="font-size:13px">内心 · tâm nội tiếp</text><text class="s" x="230" y="206">二等分線 · phân giác</text><text class="b" x="385" y="188" style="font-size:13px">重心 · trọng tâm</text><text class="s" x="385" y="206">中線 · trung tuyến</text></g>
</svg>
