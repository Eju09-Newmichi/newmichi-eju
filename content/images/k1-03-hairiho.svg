<svg xmlns="http://www.w3.org/2000/svg" width="460" height="140" viewBox="0 0 460 140" role="img" aria-labelledby="t d">
  <title id="t">背理法の流れ</title>
  <desc id="d">Phản chứng: giả sử kết luận sai, suy luận đúng đắn, gặp mâu thuẫn, kết luận mệnh đề ban đầu đúng.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 13px; }
    .b { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #5A6072; }
  </style>
  <g>
    <rect x="6" y="20" width="96" height="84" rx="8" fill="#FFFFFF" stroke="#1B1F2A" stroke-width="1.2"/>
    <text class="b" x="54" y="44" text-anchor="middle">① 否定して</text>
    <text class="b" x="54" y="62" text-anchor="middle">仮定する</text>
    <text class="s" x="54" y="86" text-anchor="middle">Giả sử điều</text><text class="s" x="54" y="99" text-anchor="middle">cần chứng minh sai</text>
  </g>
  <path d="M104 62 L120 62 M114 56 L121 62 L114 68" fill="none" stroke="#9AA1B2" stroke-width="2"/>
  <g>
    <rect x="124" y="20" width="96" height="84" rx="8" fill="#FFFFFF" stroke="#1B1F2A" stroke-width="1.2"/>
    <text class="b" x="172" y="44" text-anchor="middle">② 正しい</text>
    <text class="b" x="172" y="62" text-anchor="middle">推論を重ねる</text>
    <text class="s" x="172" y="86" text-anchor="middle">Suy luận</text><text class="s" x="172" y="99" text-anchor="middle">từng bước đúng</text>
  </g>
  <path d="M222 62 L238 62 M232 56 L239 62 L232 68" fill="none" stroke="#9AA1B2" stroke-width="2"/>
  <g>
    <rect x="242" y="20" width="96" height="84" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
    <text class="b" x="290" y="44" text-anchor="middle" style="fill:#C62828">③ 矛盾が</text>
    <text class="b" x="290" y="62" text-anchor="middle" style="fill:#C62828">起こる</text>
    <text class="s" x="290" y="86" text-anchor="middle">Gặp</text><text class="s" x="290" y="99" text-anchor="middle">mâu thuẫn</text>
  </g>
  <path d="M340 62 L356 62 M350 56 L357 62 L350 68" fill="none" stroke="#9AA1B2" stroke-width="2"/>
  <g>
    <rect x="360" y="20" width="94" height="84" rx="8" fill="#E3F0FC" stroke="#1F66C9" stroke-width="2"/>
    <text class="b" x="407" y="44" text-anchor="middle" style="fill:#1F66C9">④ もとの</text>
    <text class="b" x="407" y="62" text-anchor="middle" style="fill:#1F66C9">命題は真</text>
    <text class="s" x="407" y="86" text-anchor="middle">Mệnh đề ban</text><text class="s" x="407" y="99" text-anchor="middle">đầu là đúng</text>
  </g>
  <text class="s" x="230" y="128" text-anchor="middle">例：√3 = a/b と仮定 → a, b がともに 3 の倍数 → 「1以外に公約数をもたない」に矛盾</text>
</svg>
