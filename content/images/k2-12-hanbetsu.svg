<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-labelledby="t d">
  <title id="t">判別式と解の種類</title>
  <desc id="d">Ba parabol: D &gt; 0 cắt trục x tại hai điểm, D = 0 tiếp xúc, D &lt; 0 không cắt trục x (hai nghiệm ảo).</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <g class="ax"><path d="M10 120 H150"/><path d="M170 120 H310"/><path d="M330 120 H470"/></g>
  <path class="ul" d="M30 30 Q80 250 130 30"/><circle class="p" cx="59.2" cy="120" r="4"/><circle class="p" cx="100.8" cy="120" r="4"/>
  <path class="ul" d="M190 30 Q240 210 290 30"/><circle class="p" cx="240" cy="120" r="4"/>
  <path class="ul" d="M350 20 Q400 160 450 20"/>
  <g text-anchor="middle"><text class="r" x="80" y="150">D &gt; 0</text><text class="s" x="80" y="170">実数解 2 つ</text><text class="s" x="80" y="186">2 nghiệm thực</text>
  <text class="r" x="240" y="150">D = 0</text><text class="s" x="240" y="170">重解</text><text class="s" x="240" y="186">Nghiệm kép</text>
  <text class="r" x="400" y="150">D &lt; 0</text><text class="s" x="400" y="170">虚数解 2 つ</text><text class="s" x="400" y="186">2 nghiệm ảo</text></g>
</svg>
