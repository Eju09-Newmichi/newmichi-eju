<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" role="img" aria-labelledby="t d">
  <title id="t">点の存在範囲</title>
  <desc id="d">Với OP = sOA + tOB, s, t ≥ 0: s + t = 1 là đoạn AB; s + t ≤ 1 là tam giác OAB (tô màu).</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <path class="fu" d="M50 180 L230 180 L130 50 Z"/>
  <path class="l" d="M50 180 L230 180 M50 180 L130 50"/>
  <path class="rl" d="M230 180 L130 50"/>
  <circle class="k" cx="50" cy="180" r="3.5"/><circle class="k" cx="230" cy="180" r="3.5"/><circle class="k" cx="130" cy="50" r="3.5"/>
  <text x="34" y="196">O</text><text x="234" y="196">A</text><text x="124" y="42">B</text>
  <text class="r" x="190" y="104">s + t = 1</text>
  <text class="u" x="100" y="150">s + t ≦ 1</text>
  <text class="s" x="260" y="60">OP = sOA + tOB</text><text class="s" x="260" y="80">s ≧ 0, t ≧ 0</text>
  <text class="s" x="260" y="120">△OAB の周と内部</text><text class="s" x="260" y="138">Cạnh và miền trong △OAB</text>
</svg>
