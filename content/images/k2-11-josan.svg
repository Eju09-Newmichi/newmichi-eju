<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-labelledby="t d">
  <title id="t">整式の割り算</title>
  <desc id="d">Chia x³ + 2x² + 3x + 4 cho x² + 3 theo kiểu Nhật: thương x + 2, dư −2.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <g text-anchor="end">
  <text class="u" x="250" y="30">x + 2</text>
  <text x="80" y="62">x² + 3</text>
  <text x="300" y="62">x³ + 2x² + 3x + 4</text>
  <text x="300" y="90">x³ &#160;&#160;&#160;&#160;&#160;&#160;&#160;+ 3x &#160;&#160;&#160;&#160;&#160;</text>
  <text x="300" y="122">2x² &#160;&#160;&#160;&#160;&#160;&#160;&#160;+ 4</text>
  <text x="300" y="150">2x² &#160;&#160;&#160;&#160;&#160;&#160;&#160;+ 6</text>
  <text class="r" x="300" y="182">−2</text>
  </g>
  <path class="l" d="M90 42 H310 M90 42 Q100 55 90 70"/>
  <path class="t" d="M150 98 H310 M150 158 H310"/>
  <text x="330" y="70" class="s">商 thương</text><text class="u" x="330" y="90">Q = x + 2</text>
  <text x="330" y="140" class="s">余り dư</text><text class="r" x="330" y="160">R = −2</text>
</svg>
