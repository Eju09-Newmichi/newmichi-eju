<svg xmlns="http://www.w3.org/2000/svg" width="460" height="210" viewBox="0 0 460 210" role="img" aria-labelledby="t d">
  <title id="t">パスカルの三角形</title>
  <desc id="d">Tam giác Pascal hàng n = 0 đến 5; mỗi số bằng tổng hai số phía trên, ví dụ 4 + 6 = 10.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <g text-anchor="middle">
  <text x="160" y="28">1</text>
  <text x="140" y="58">1</text><text x="180" y="58">1</text>
  <text x="120" y="88">1</text><text x="160" y="88">2</text><text x="200" y="88">1</text>
  <text x="100" y="118">1</text><text x="140" y="118">3</text><text x="180" y="118">3</text><text x="220" y="118">1</text>
  <text x="80" y="148">1</text><text class="u" x="120" y="148">4</text><text class="u" x="160" y="148">6</text><text x="200" y="148">4</text><text x="240" y="148">1</text>
  <text x="60" y="178">1</text><text x="100" y="178">5</text><text class="r" x="140" y="178">10</text><text x="180" y="178">10</text><text x="220" y="178">5</text><text x="260" y="178">1</text>
  </g>
  <path class="ul" d="M124 153 L136 164"/><path class="ul" d="M156 153 L144 164"/>
  <g class="s"><text x="10" y="28">n=0</text><text x="10" y="58">n=1</text><text x="10" y="88">n=2</text><text x="10" y="118">n=3</text><text x="10" y="148">n=4</text><text x="10" y="178">n=5</text></g>
  <text class="r" x="300" y="90">4 + 6 = 10</text>
  <text class="s" x="300" y="115">上の 2 つの数の和</text><text class="s" x="300" y="133">Tổng hai số phía trên</text>
  <text x="300" y="170">(a+b)⁵ の係数</text><text class="s" x="300" y="190">Hệ số của (a+b)⁵</text>
</svg>
