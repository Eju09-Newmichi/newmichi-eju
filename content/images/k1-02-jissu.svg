<svg xmlns="http://www.w3.org/2000/svg" width="460" height="236" viewBox="0 0 460 236" role="img" aria-labelledby="t d">
  <title id="t">実数の分類</title>
  <desc id="d">Số thực gồm số hữu tỉ (số nguyên, số thập phân hữu hạn, số thập phân vô hạn tuần hoàn) và số vô tỉ (số thập phân vô hạn không tuần hoàn như căn 2, pi).</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; }
    .h { font-size: 17px; font-weight: 700; }
    .t { font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
  </style>
  <rect x="6" y="6" width="448" height="224" rx="10" fill="#FFFFFF" stroke="#1B1F2A" stroke-width="1.5"/>
  <text class="h" x="20" y="30">実数 · Số thực</text>

  <rect x="20" y="44" width="250" height="172" rx="8" fill="#E3F0FC" stroke="#1F66C9" stroke-width="1.5"/>
  <text class="h" x="34" y="68" style="fill:#1F66C9">有理数 · Số hữu tỉ</text>
  <text class="s" x="34" y="88">分数 m/n で表せる数</text>
  <text class="t" x="34" y="118">● 整数　…, −2, 0, 3, …</text>
  <text class="t" x="34" y="148">● 有限小数　0.25 = 1/4</text>
  <text class="t" x="34" y="178">● 循環小数　0.333… = 1/3</text>
  <text class="s" x="34" y="202">(số nguyên, thập phân hữu hạn, tuần hoàn)</text>

  <rect x="284" y="44" width="158" height="172" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="1.5"/>
  <text class="h" x="298" y="68" style="fill:#C62828">無理数 · Số vô tỉ</text>
  <text class="s" x="298" y="88">循環しない無限小数</text>
  <text class="t" x="298" y="118">● √2 = 1.4142…</text>
  <text class="t" x="298" y="148">● √3 = 1.7320…</text>
  <text class="t" x="298" y="178">● π = 3.1415…</text>
  <text class="s" x="298" y="202">(vô hạn không tuần hoàn)</text>
</svg>
