<svg xmlns="http://www.w3.org/2000/svg" width="460" height="170" viewBox="0 0 460 170" role="img" aria-labelledby="t d">
  <title id="t">円順列</title>
  <desc id="d">Bốn người ngồi vòng tròn: cố định một người, xếp ba người còn lại, có 3 giai thừa bằng 6 cách.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <circle class="ul" cx="90" cy="85" r="55"/><circle class="p" cx="90" cy="30" r="10"/><circle cx="145" cy="85" r="10" fill="#E3F0FC" stroke="#1F66C9"/><circle cx="90" cy="140" r="10" fill="#E3F0FC" stroke="#1F66C9"/><circle cx="35" cy="85" r="10" fill="#E3F0FC" stroke="#1F66C9"/>
  <text x="90" y="35" text-anchor="middle" style="fill:#FFFFFF;font-size:13px">A</text><text x="145" y="90" text-anchor="middle" style="font-size:13px">B</text><text x="90" y="145" text-anchor="middle" style="font-size:13px">C</text><text x="35" y="90" text-anchor="middle" style="font-size:13px">D</text>
  <text class="b" x="190" y="50">1人を固定する</text><text class="s" x="190" y="68">Cố định một người</text><text x="190" y="100">残り3人の並び方 3! = 6</text><text class="s" x="190" y="118">Xếp 3 người còn lại</text><text class="r" x="190" y="150">(n − 1)! 通り</text>
</svg>
