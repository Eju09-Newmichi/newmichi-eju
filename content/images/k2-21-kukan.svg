<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-labelledby="t d">
  <title id="t">空間座標</title>
  <desc id="d">Ba trục x, y, z vuông góc; điểm P(a, b, c) và điểm đối xứng qua mặt phẳng xy là (a, b, −c).</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .k { fill: #1B1F2A; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
    .ax { fill: none; stroke: #5A6072; stroke-width: 1.3; }
  </style>
  <path class="ax" d="M150 120 L60 210 M150 120 H330 M150 230 V20"/>
  <text class="s" x="50" y="224">x</text><text class="s" x="334" y="124">y</text><text class="s" x="156" y="24">z</text><text class="s" x="156" y="134">O</text>
  <path class="d" d="M120 150 L240 150 L270 120 M240 150 V60 M240 150 V200"/>
  <circle class="p" cx="240" cy="60" r="5"/><circle class="u" cx="240" cy="200" r="5" style="fill:#1F66C9"/>
  <text class="r" x="248" y="56">P(a, b, c)</text><text class="u" x="248" y="214">(a, b, −c)</text>
  <text class="s" x="300" y="160">xy 平面 (z = 0)</text><text class="s" x="300" y="176">Mặt phẳng xy</text>
  <text class="s" x="20" y="40">AB = √(Δx² + Δy² + Δz²)</text>
</svg>
