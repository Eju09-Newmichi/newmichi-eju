<svg xmlns="http://www.w3.org/2000/svg" width="460" height="180" viewBox="0 0 460 180" role="img" aria-labelledby="t d">
  <title id="t">樹形図</title>
  <desc id="d">Sơ đồ cây: chọn lần 1 có 2 cách, mỗi cách có 3 cách ở lần 2, tất cả 6 cách.</desc>
  <style>
    text { font-family: "Times New Roman", Tinos, "Shippori Mincho", serif; fill: #1B1F2A; font-size: 15px; }
    .s { font-size: 13px; fill: #5A6072; }
    .b { font-weight: 700; }
    .r { fill: #C62828; font-weight: 700; }
    .u { fill: #1F66C9; font-weight: 700; }
    .l { fill: none; stroke: #1B1F2A; stroke-width: 2; }
    .t { fill: none; stroke: #1B1F2A; stroke-width: 1.2; }
    .d { fill: none; stroke: #9AA1B2; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .rl { fill: none; stroke: #C62828; stroke-width: 2.5; }
    .ul { fill: none; stroke: #1F66C9; stroke-width: 2.5; }
    .ol { fill: none; stroke: #B9531A; stroke-width: 2.5; }
    .p { fill: #C62828; }
    .fu { fill: #E3F0FC; stroke: none; }
    .fr { fill: #FDECEA; stroke: none; }
  </style>
  <g class="t"><path d="M40 90 L120 45"/><path d="M40 90 L120 135"/><path d="M130 45 L210 18"/><path d="M130 45 L210 45"/><path d="M130 45 L210 72"/><path d="M130 135 L210 108"/><path d="M130 135 L210 135"/><path d="M130 135 L210 162"/></g>
  <circle class="p" cx="36" cy="90" r="4"/><text class="u" x="120" y="42">a</text><text class="u" x="120" y="150">b</text>
  <text x="216" y="23">1</text><text x="216" y="50">2</text><text x="216" y="77">3</text><text x="216" y="113">1</text><text x="216" y="140">2</text><text x="216" y="167">3</text>
  <text class="r" x="270" y="80">2 × 3 = 6 通り</text><text class="s" x="270" y="104">積の法則 · quy tắc nhân</text><text class="s" x="270" y="124">もれなく重複なく</text><text class="s" x="270" y="142">không sót, không trùng</text>
</svg>
